<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lavanderia Santa Marta</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,700;0,800;1,700;1,800&display=swap">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0e7c86"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Santa Marta"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#fff6e8;--card:#fff;--tx:#1b2430;--mu:#5a6676;--ac:#0e7c86;--on:#fff;--chip:#dff1f3;--ln:#f0dfc4;--rd:#b3262f;--or:#a35f00;--gr:#1d7a4a;--r:24px;--rb:99px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1b222b;--tx:#e8ecf1;--mu:#98a4b3;--ac:#3fb8c4;--on:#08262a;--chip:#17343a;--ln:#2b3440;--rd:#ff8f98;--or:#ffc247;--gr:#7be0a6;color-scheme:dark}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0 auto;background:var(--bg);color:var(--tx);font:16px/1.4 'Nunito',system-ui,-apple-system,Segoe UI,sans-serif;max-width:640px;padding:14px}
h1{font-size:21px;margin:4px 0;font-weight:800}h2{font-size:17px;margin:14px 0 6px;font-weight:800}
.card{background:var(--card);border:2px solid var(--ln);border-radius:var(--r);padding:14px;margin:10px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--card);border:2px solid var(--ln);border-radius:14px;padding:10px 12px}
button{cursor:pointer;font-weight:700;border-radius:var(--rb);padding:10px 16px;min-height:44px}button:disabled{opacity:.45;cursor:not-allowed}button.p{background:var(--ac);color:var(--on);border-color:var(--ac)}button.d{color:var(--rd);border-color:var(--rd)}
input,select{width:100%}.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:6px 0}.tabs button{white-space:nowrap}.tabs .on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.mu{color:var(--mu);font-size:14px}.tag{font-size:12px;font-weight:800;padding:2px 10px;border-radius:99px;border:2px solid var(--ln)}
.ok{color:var(--gr)}.wa{color:var(--or)}.er{color:var(--rd)}
.bar{height:12px;background:var(--ac);border-radius:6px}.bw{background:var(--ln);border-radius:6px;flex:1}
.av{width:48px;height:48px;border-radius:50%;background:var(--chip);border:2px solid var(--ln);display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.hero{background:var(--ac);color:var(--on);border-radius:var(--r);padding:16px 20px;margin:10px 0}.hero .d1{font-weight:700;opacity:.92}.hero .d2{font-size:44px;font-weight:800;line-height:1.1}.hero .d3{margin-top:6px;font-weight:800}
.bigb{display:flex;align-items:center;gap:16px;text-align:left;width:100%;padding:16px;border-radius:var(--r);min-height:82px;border:2px solid var(--ln);background:var(--card)}
.bigb .ic{width:52px;height:52px;border-radius:18px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--chip);color:var(--ac)}.bigb .t{display:block;font-size:19px;font-weight:800}.bigb .st{font-size:14px;color:var(--mu);font-weight:600}
#dock{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);max-width:616px;margin:auto;z-index:9;pointer-events:none}#dock>*{pointer-events:auto}#toast{margin:0}
#toast div{background:var(--ac);color:var(--on);font-weight:700;border-radius:18px;padding:12px 14px;margin-bottom:6px;box-shadow:0 4px 14px #0004}
.g{display:grid;gap:8px;grid-template-columns:1fr 1fr}
#alertbar{margin:0}
.alertbox{background:var(--card);border:2px solid var(--or);border-radius:20px;padding:12px 14px;margin:8px 0;box-shadow:0 4px 14px #0003}
.alertbox div{margin:4px 0}.alertbox .cd{height:4px;background:var(--or);border-radius:2px;margin-top:8px;animation:cd 20s linear forwards}
@keyframes cd{from{width:100%}to{width:0}}
#rpt::placeholder,#rmx::placeholder{font-style:italic}

 use(t){sel.bt=new Date(t-new Date().getTimezoneOffset()*M).toISOString().slice(0,16);machModal(sel.m)},
 cancel(id){closeM();const b=S.bookings.find(x=>x.id==id);if(b){const was=b.status;b.status='cancelled';b.why='annullata da te';if(was=='booked'){offerNext(b);if(cutLinked(b,1))alert('Anche l’asciugatura collegata a questo lavaggio è stata annullata.')}save();render()}},
 start(id){closeM();const b=S.bookings.find(x=>x.id==id);if(!b||!canGo(b))return;const o0=b.o0,wasA=b.ofConf!=null;b.status='running';clearOf(b);b.startedAt=now();b.end=b.startedAt+prog(b.pid).min*M;if(wasA)offerAfter(b,o0);save();render()},
 stop(id){const b=S.bookings.find(x=>x.id==id);b.status='done';b.endedAt=now();S.log.push({id:b.id,mid:b.mid,uid:b.uid,pid:b.pid,s:b.startedAt||b.start,e:b.endedAt,late:Math.max(0,Math.round((b.endedAt-b.end)/M))});if(b.end-b.endedAt>=5*M)offerNext(b);else{const nx=nextOf(b),n=b.endedAt;if(nx&&nx.start<=n+5*M){nx.f1=1;notify(nx.uid,n>b.end+M?'Il turno precedente ha subito ritardo, puoi iniziare ora. Ricordati di premere Avvia entro 30 minuti.':'È il tuo turno, buon lavaggio. Ricordati di premere Avvia entro 30 minuti.',nx.id);if(who==nx.uid)openAlert()}}save();render()},
 block(id){const m=S.machines.find(x=>x.id==id);if(!m.blocked){modal(`<h2>Blocca ${esc(m.name)}</h2><p class="mu">Commento visibile agli utenti</p><input id="bc" value="MANUTENZIONE IN CORSO"><div class="row" style="margin-top:12px"><button class="p" onclick="A.doBlock('${id}')">Blocca</button><button onclick="closeM()">Annulla</button></div>`);return}audit('Sblocco '+m.name);m.blocked='';save();render()},
 doBlock(id){const m=S.machines.find(x=>x.id==id),v=document.getElementById('bc').value.trim()||'MANUTENZIONE IN CORSO';closeM();audit('Blocco '+m.name);{m.blocked=v;
   S.bookings.filter(b=>b.mid==id&&b.status=='booked').forEach(b=>{notify(b.uid,`Prenotazione su ${m.name} annullata: ${m.blocked}.`);b.status='cancelled';b.why='macchina bloccata ('+m.blocked+')'})}save();render()},
 addM(){if(S.machines.length>=20)return alert('Hai raggiunto il massimo di 20 macchine');const g=i=>document.getElementById(i).value.trim();if(!g('mn'))return alert('Nome richiesto');audit('Aggiunta macchina '+g('mn'));const f=document.getElementById('mi').files[0],add=img=>{S.machines.push({id:uid(),name:g('mn'),brand:g('mb'),model:g('mo'),serial:g('ms'),kg:+g('mk')||0,type:g('mt'),blocked:'',img});save();render()};if(f)imgData(f).then(add);else add('')},
 delM(id){conf('Eliminare la macchina e le sue prenotazioni?',()=>{audit('Eliminata macchina '+mach(id).name);S.machines=S.machines.filter(m=>m.id!=id);S.programs=S.programs.filter(p=>p.mid!=id);dropB(b=>b.mid==id);nullLog('mid',id);save();render()})},
 addP(){const g=i=>document.getElementById(i).value.trim(),ty=g('pt'),x=g('pmx');if(!ty)return alert('Scegli il tipo: lavaggio o asciugatura');if(!x)return alert('Scegli per quale macchina è il programma');if(!g('pn')||!+g('pm'))return alert('Nome e minuti richiesti');
  const mi=x=='all'?null:x;if(mi&&!S.machines.some(m=>m.id==mi&&m.type==ty))return alert('Macchina non valida per questo tipo');
  if(S.programs.some(p=>(p.mid||null)==mi&&p.type==ty&&p.name.toLowerCase()==g('pn').toLowerCase()))return alert('Questa macchina ha già un programma con questo nome');
  audit('Aggiunto programma '+g('pn')+(mi?' ('+mach(mi).name+')':' (tutte le '+(ty=='wash'?'lavatrici':'asciugatrici')+')'));S.programs.push({id:uid(),name:g('pn'),type:ty,mid:mi||undefined,min:+g('pm')});save();render()},
 ptype(v){const e=document.getElementById('pmx');if(!e)return;e.innerHTML=v?'<option value="">Per quale macchina?</option>'+S.machines.filter(m=>m.type==v).map(m=>'<option value="'+m.id+'">'+esc(m.name)+(m.model?' · '+esc(m.model):'')+'</option>').join('')+'<option value="all">Tutte le '+(v=='wash'?'lavatrici':'asciugatrici')+'</option>':'<option value="">Prima scegli il tipo</option>'},
 delP(id){audit('Eliminato programma '+prog(id).name);S.programs=S.programs.filter(p=>p.id!=id);S.bookings.forEach(b=>{if(b.pid==id)b.pid=null});nullLog('pid',id);save();render()},
};
function render(){
 const el=document.getElementById('app');
 document.body.classList.toggle('lg',!who);
 if(!who&&BOOT){el.innerHTML=BOOT==1?'<p class="mu" style="text-align:center;margin-top:35vh">Caricamento…</p>':'<h1>🧺 Lavanderia Santa Marta</h1><p class="mu">Non riesco a collegarmi: controlla la connessione.</p><button class="p" onclick="boot()">Riprova</button>';return}
 if(!who){el.innerHTML=`<h1>🧺 Lavanderia Santa Marta</h1>
 ${sel.adm?'':`<div class="card"><h2>Entra come inquilino</h2><input id="us" placeholder="Il nome che ti è stato assegnato" autocomplete="username"><div style="position:relative;margin-top:8px"><input id="up" type="password" placeholder="Password (primo accesso: lascia vuoto)" style="padding-right:46px"><button type="button" onclick="tp('up',this)" aria-label="Mostra password" style="position:absolute;right:3px;top:3px;border:0;background:transparent;padding:6px 10px">👁️</button></div><div class="row" style="margin-top:8px"><button class="p" onclick="A.userLogin()">Entra</button></div></div>
 <div class="card"><h2>Non hai ancora un account?</h2><p class="mu">Inquadrando il QR in lavanderia si arriva a questo modulo. Non inserire dati personali: riceverai un codice da comunicare agli amministratori di persona o per telefono, che ti assegneranno un nome utente.</p><div class="row" style="margin-top:8px"><button class="p" onclick="A.req()">Richiedi accesso</button></div></div>
 <p class="mu" style="text-align:center">Sei un admin? <a href="#" onclick="sel.adm=1;render();return false">Clicca qui</a> · <a href="#" onclick="A.forgot();return false">Hai dimenticato la password?</a></p>`}
 ${sel.adm?`<div class="card"><h2>Amministratori</h2><input id="ai" placeholder="Nome admin" autocomplete="off"><div style="position:relative;margin-top:8px"><input id="ap" type="password" placeholder="Password (primo accesso: lascia vuoto)" style="padding-right:46px"><button type="button" onclick="tp('ap',this)" aria-label="Mostra password" style="position:absolute;right:3px;top:3px;border:0;background:transparent;padding:6px 10px">👁️</button></div><div class="row" style="margin-top:8px"><button class="p" onclick="A.admLogin()">Entra</button></div></div><p class="mu" style="text-align:center">Sei un inquilino? <a href="#" onclick="sel.adm=0;render();return false">Clicca qui</a> · Hai dimenticato la password? <a href="#" onclick="A.aforgot();return false">Clicca qui</a></p>`:''}`;return}
 const adm=isAdm(),sup=isSup();
 if(tab=='nt')S.notifs.forEach(n=>{if(mine(n))markSeen(n)});
 el.innerHTML=`<div class="row sp"><div style="display:flex;align-items:center;gap:10px;min-width:0;flex:1">${(a=>a?'<span class="av" style="overflow:hidden">'+avCircle(a,44)+'</span>':'<span aria-hidden="true" class="av">'+(adm?(sup?'👑':'🛠️'):'👤')+'</span>')(avParse(avOf(who)))}<div style="min-width:0"><h1 style="margin:0"><i>${esc(adm?adName():usr(who))}</i></h1>${adm?'<span class="tag">'+(sup?'Super admin':'Admin')+'</span>':''}</div></div><span class="row" style="gap:10px">${adm?'':mBtn()}<button onclick="A.tab('nt')" aria-label="Notifiche" style="position:relative;border-radius:50%;width:42px;height:42px;padding:0;font-size:20px;line-height:1${tab=='nt'?';border-color:var(--ac)':''}">🔔${(k=>k?`<span style="position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--card);border:1.5px solid var(--rd);color:var(--rd);font-size:12px;font-weight:700;line-height:17px;padding:0 4px">${k}</span>`:'')(S.notifs.filter(n=>mine(n)&&(adm?!isDone(n):!isSeen(n))).length)}</button><button onclick="A.out()">Esci</button></span></div>
 ${homeDate()}
 ${navBar()}`+(views[tab]?views[tab]():'')}
const bCard=(b,c)=>{const n=now(),late=b.status=='running'&&n>b.end;return `<div class="card"><div class="row sp"><b>${esc(mach(b.mid).name)}</b><span class="tag ${late?'er':b.status=='running'?'ok':''}">${late?'In ritardo '+Math.round((n-b.end)/M)+'′':(b.auto?'Annullata (non avviata)':{booked:'Prenotata',running:'In corso',done:'Terminata',cancelled:'Annullata'}[b.status])}</span></div>
<div class="mu">${esc(prog(b.pid).name)} · ${fT(b.start)} → ${fT(b.end)}</div>${c=='me'&&b.status=='cancelled'?`<div class="er" style="margin-top:6px">Motivo: ${esc(b.why||(b.auto?'non avviata entro 30 minuti dall’orario prenotato':'annullata da te'))}</div>`:''}${c=='me'&&b.status=='booked'&&b.of?(b.ofConf?`<div class="wa">Avvia entro ${Math.max(1,Math.ceil((Math.max(b.ofConf,b.start)+5*M-n)/M))} min, altrimenti la prenotazione torna all’orario originale.</div>`:`<div class="wa">🍀 Puoi anticipare: la macchina ${b.os>n+M?'sarà libera alle '+fT(b.os):'è libera adesso'}.</div><button class="p" onclick="A.ofAsk('${b.id}')">Conferma anticipo</button>`):''}
<div class="row" style="margin-top:8px">${(c=='me'||c=='mm')&&b.status=='booked'?canGo(b)?`<button class="p" onclick="A.start('${b.id}')">Avvia</button>`:`<button class="p" disabled>Avvia</button><span class="mu" style="align-self:center;font-size:12px">${b.start>now()?'Disponibile dalle '+fT(b.start):'Macchina ancora in uso'}</span>`:''}${c=='mm'&&b.status=='running'?`<button class="p" onclick="A.ask('${b.id}')">Termina</button>`:''}${b.status=='booked'?`<button class="d" onclick="A.cancel('${b.id}')">Annulla</button>`:''}</div>${c=='me'?(h=>h?`<div class="row" style="margin-top:8px">${h}</div>`:'')(mBtns(b)):''}</div>`};
const views={
 new(){return newV()},
 msg(){return mMine()?(sel.mc?mThread(sel.mc):mList()):''},
 ahome(){return `<h2><i>${greet()}, cosa vuoi fare ${esc(adName())}?</i></h2>${avOf(who)?'':'<div class="card"><div class="row" style="align-items:center;gap:12px">'+avHtml(who,48,0)+'<div style="flex:1"><b>Crea il tuo avatar</b><div class="mu">Scegli come apparire accanto al tuo nome.</div></div><button class="p" onclick="A.avEdit()">Crea</button></div></div>'}<div style="display:grid;gap:12px">${AG().map(g=>`<button class="bigb" onclick="A.tab('${g.tabs[0][0]}')"><span class="ic" style="font-size:26px">${g.ic}</span><span><span class="t">${g.t}</span><span class="st">${g.d}</span></span></button>`).join('')}</div>`},
 home(){return `<h2><i>${greet()}, cosa vuoi fare ${esc(usr(who))}?</i></h2><div style="display:grid;gap:12px">${[['new','🧺','Prenota','Scegli macchina, programma e orario'],['mine','📅','Le mie prenotazioni','Avvia, termina o annulla'],['msg','✉️','Messaggi','Scrivi a chi usa la macchina prima o dopo di te'],['pr','👤','Profilo','Account e password']].map(x=>`<button class="bigb" onclick="A.tab('${x[0]}')"><span class="ic" style="font-size:26px">${x[1]}</span><span><span class="t">${x[2]}</span><span class="st">${x[3]}</span></span></button>`).join('')}</div><button onclick="A.rep()" style="width:100%;margin-top:14px;border:2px dashed var(--ac);color:var(--ac);background:transparent">⚠️ Segnala un problema</button>`},
 mine(){const t=sel.mt||'att',all=S.bookings.filter(b=>b.uid==who).sort((a,c)=>c.start-a.start),f={att:b=>live(b),ter:b=>b.status=='done',ann:b=>b.status=='cancelled'},L=[['att','Attive'],['ter','Terminate'],['ann','Annullate']],l=all.filter(f[t]);return `<div class="row" style="margin:6px 0">${L.map(x=>`<button class="${t==x[0]?'p':''}" onclick="sel.mt='${x[0]}';render()">${x[1]} (${all.filter(f[x[0]]).length})</button>`).join('')}</div>`+(l.length?l.map(b=>bCard(b,'me')).join(''):'<p class="mu">Nessuna prenotazione.</p>')},
 nt(){return isAdm()?ntAdm():ntUser()},
 mc(){return S.machines.map(m=>`<div class="card"><div class="row sp"><b>${esc(m.name)}</b><span><span class="tag">${m.type=='wash'?'Lavatrice':'Asciugatrice'}</span> ${m.blocked?'<span class="tag er" style="font-weight:700">BLOCCATA</span>':stBadge(m.id)}</span></div><div class="mu">${esc(((m.brand||'')+' '+(m.model||'')).trim()||'Marca e modello non indicati')}</div><div class="mu">Seriale ${esc(m.serial||'—')} · ${m.kg} kg</div>${m.blocked?`<div class="er">⛔ ${esc(m.blocked)}</div>`:''}
  <div class="row" style="margin-top:8px"><button onclick="A.mEdit('${m.id}')">Modifica</button><button onclick="A.block('${m.id}')">${m.blocked?'Sblocca':'Blocca prenotazioni'}</button><button class="d" onclick="A.delM('${m.id}')">Elimina</button></div></div>`).join('')+
  (S.machines.length>=20?'<div class="card"><p class="mu">Hai raggiunto il massimo di 20 macchine: eliminane una per aggiungerne un\'altra.</p></div>':`<div class="card"><h2>Aggiungi macchina</h2><div class="g"><input id="mn" placeholder="Nome"><input id="mb" placeholder="Marca"><input id="mo" placeholder="Modello"><input id="ms" placeholder="Seriale"><input id="mk" type="number" placeholder="Kg"><select id="mt"><option value="wash">Lavatrice</option><option value="dry">Asciugatrice</option></select></div><p class="mu" style="margin-top:8px">Immagine (facoltativa):</p><input id="mi" type="file" accept="image/*"><div class="row" style="margin-top:8px"><button class="p" onclick="A.addM()">Aggiungi</button></div></div>`)},
 pg(){const row=p=>`<div class="card row sp"><span><b>${esc(p.name)}</b> <span class="mu">${p.type=='wash'?'lavaggio':'asciugatura'} · ${p.min}′</span></span><button class="d" onclick="A.delP('${p.id}')">✕</button></div>`,
  gr=S.machines.map(m=>({t:m.name+(m.model?' · '+m.model:''),l:S.programs.filter(p=>p.mid==m.id)})).concat([{t:'Tutte le lavatrici',l:S.programs.filter(p=>!p.mid&&p.type=='wash')},{t:'Tutte le asciugatrici',l:S.programs.filter(p=>!p.mid&&p.type=='dry')}]).filter(g=>g.l.length);
  return (gr.map(g=>`<h3 style="margin:14px 0 6px">${esc(g.t)}</h3>`+g.l.map(row).join('')).join('')||'<p class="mu">Nessun programma: aggiungine uno per ogni macchina.</p>')+
  `<div class="card"><h2>Nuovo programma</h2><div class="g"><input id="pn" placeholder="Nome"><input id="pm" type="number" placeholder="Minuti"></div><select id="pt" style="margin-top:8px" onchange="A.ptype(this.value)"><option value="">Tipo di programma</option><option value="wash">Lavaggio</option><option value="dry">Asciugatura</option></select><select id="pmx" style="margin-top:8px"><option value="">Prima scegli il tipo</option></select><div class="row" style="margin-top:8px"><button class="p" onclick="A.addP()">Aggiungi</button></div></div>`},
 us(){return `<h2>Richieste di accesso (${S.requests.length})</h2>`+(S.requests.map(r=>`<div class="card"><div class="mu">${fT(r.t)} · Codice <b>${esc(r.note)}</b></div><input id="n${r.id}" placeholder="Nome da assegnare (es. Mario R. int. 3)" style="margin-top:8px"><div class="row" style="margin-top:8px"><button class="p" onclick="A.approve('${r.id}')">Approva</button><button class="d" onclick="A.reject('${r.id}')">Rifiuta</button></div></div>`).join('')||'<p class="mu">Nessuna richiesta.</p>')+
  `<h2>Utenti (${S.users.length})</h2>`+S.users.map(u=>`<div class="card row sp">${esc(u.name)}<button class="d" onclick="A.delUser('${u.id}')">Rimuovi</button></div>`).join('')},
 ad(){const f=(t,b,h)=>`<div class="card"><h2>${t}</h2>${h||''}<input id="an" placeholder="Nome"><p class="mu">La persona sceglierà la sua password al primo accesso, scrivendo solo il nome.</p><div class="row" style="margin-top:8px"><button class="p" onclick="A.${b}()">${b=='addAd'?'Crea admin':'Invia richiesta'}</button></div></div>`;
  return isSup()?`<h2>Account admin</h2>`+(S.admins.map(a=>`<div class="card row sp">${esc(a.name)} <span class="tag">${a.role=='super'?'Super admin':'Admin'}</span>${a.role=='super'?'':`<button class="d" onclick="A.delAd('${a.id}')">Rimuovi</button>`}</div>`).join(''))+f('Nuovo admin','addAd'):f('Richiedi un nuovo admin','reqAd','<p class="mu">La richiesta arriva al super admin, che la accetta o la rifiuta. Riceverai una notifica con la risposta.</p>')},
 pr(){const adm=isAdm(),a=adm?S.admins.find(x=>'admin:'+x.id==who):null,u=adm?null:S.users.find(x=>x.id==who),pend=S.notifs.some(n=>n.kind=='del'&&n.tid==who&&!n.done);if(!a&&!u)return'';return `<div class="card"><h2>Il mio avatar</h2><div class="row" style="align-items:center;gap:12px">${avHtml(who,64,0)}<button class="p" onclick="A.avEdit()">${avOf(who)?'Modifica avatar':'Crea il tuo avatar'}</button></div></div>${isAdm()?'':'<div class="card"><h2>Dati a fini statistici</h2><div class="mu">Informativa accettata.</div><div class="row"><button onclick="A.statView()">Leggi l\'informativa</button></div></div>'}<div class="card"><h2>Il mio account</h2><div>Nome: <b>${esc((a||u).name)}</b></div><div>Tipo di account: <b>${adm?(a.role=='super'?'Super admin':'Admin'):'Utente'}</b></div></div><div class="card"><h2>Modifica password</h2>${pwf('op','Password attuale')}${pwf('np1','Nuova password (min. 6)',8)}${pwf('np2','Ripeti la nuova password',8)}<p id="pe2" class="er"></p><button class="p" onclick="A.chPw()">Salva password</button></div>${isSup()?'':`<div class="card"><h2>Elimina account</h2>${pend?'<p class="mu">Richiesta inviata: in attesa che un amministratore la accetti.</p>':'<p class="mu">Gli amministratori riceveranno la richiesta e dovranno accettarla.</p><button class="d" onclick="A.delReq()">Richiedi cancellazione</button>'}</div>`}`},
 au(){return `<p class="mu">Registro delle azioni degli amministratori.</p>`+(S.audit.map(x=>`<div class="card"><b>${esc(x.m)}</b><div class="mu">${esc(x.by)} · ${fT(x.t)}</div></div>`).join('')||'<p class="mu">Nessuna azione.</p>')},
 rg(){const l=S.log.slice().reverse();return `<p class="mu">Registro visibile solo agli admin.</p>`+(l.length?l.map(x=>`<div class="card"><div class="row sp"><b>${esc(mach(x.mid).name)}</b><span class="${x.late>0?'wa':'ok'}">${x.late>0?'ritardo '+x.late+'′':'puntuale'}</span></div><div class="mu">${esc(prog(x.pid).name)} · ${esc(usr(x.uid))}<br>${fT(x.s)} → ${fT(x.e)}</div></div>`).join(''):'<p class="mu">Nessun ciclo completato.</p>')},
 st(){return stNew()}
};
render();boot();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script></body></html>
